services:
  tradebot:
    # Builds straight from GitHub — no local checkout needed, just this file
    # plus .env. Pulls whatever is on `main` at build time. If you're actively
    # editing the code locally, swap this line for `build: .` so your
    # uncommitted changes get picked up instead of what's pushed.
    build: https://github.com/RVDFeen/TradeSecret.git
    image: tradebot:latest
    env_file:
      - .env
    volumes:
      # Bar cache AND the trade fill log (data/trades.jsonl) both live under
      # here — back this volume up if you care about trade history surviving
      # `docker compose down -v`.
      - tradebot-data:/app/data
    restart: unless-stopped
    # Default: the live paper-trading loop. Override for one-off runs, e.g.:
    #   docker compose run --rm tradebot backtest --years 2 --timeframe hourly
    #   docker compose run --rm tradebot run --once
    command: ["run"]

volumes:
  tradebot-data:
